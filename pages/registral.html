<div class="page">
  <div class="page-heading">
    <div>
      <span class="eyebrow"> Registro sindical </span>

      <h1>Registral</h1>

      <p>
        Consulta y registra los documentos registrales de los sindicatos.
        Se envían a Presidencia desde el Resumen histórico.
      </p>
    </div>

    <button class="primary-btn" data-action="new-registral">
      + Nuevo registral
    </button>
  </div>

  <div class="toolbar">
    <div class="toolbar-search">
      <i class="fa-solid fa-magnifying-glass"></i>

      <input
        type="search"
        id="registralSearch"
        placeholder="Buscar registral, sindicato o expediente..."
        autocomplete="off"
      />
    </div>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Expediente (sindicato)</th>

          <th>Sindicato</th>

          <th>Oficio</th>

          <th>Fecha</th>

          <th>Tipo</th>

          <th>Descripción</th>

          <th>Acción</th>
        </tr>
      </thead>

      <tbody id="registralTable"></tbody>
    </table>
  </div>
</div>
