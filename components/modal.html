<div
    id="modal"
    class="modal"
    aria-hidden="true"
>

    <div
        class="modal-card"
        role="dialog"
        aria-modal="true"
    >

        <button
            id="modalCloseBtn"
            type="button"
            class="modal-close"
            aria-label="Cerrar"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>


        <div id="modalContent"></div>

    </div>

</div>
